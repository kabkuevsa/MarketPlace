name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: warehouse_test_db
        ports:
          - 5445:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d warehouse_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      WAREHOUSE_TEST_CONNECTION_STRING: Host=localhost;Port=5445;Database=warehouse_test_db;Username=postgres;Password=postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Marketplace.slnx

      - name: Build solution
        run: dotnet build Marketplace.slnx --no-restore --configuration Release

      - name: Run automated tests
        run: dotnet test Marketplace.slnx --no-build --configuration Release --logger "console;verbosity=normal"