services:
  postgres-identity:
    image: postgres:16
    container_name: marketplace-identity-db
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5442:5432"
    volumes:
      - postgres-identity-data:/var/lib/postgresql/data

  postgres-catalog:
    image: postgres:16
    container_name: marketplace-catalog-db
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5443:5432"
    volumes:
      - postgres-catalog-data:/var/lib/postgresql/data

  postgres-orders:
    image: postgres:16
    container_name: marketplace-orders-db
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5444:5432"
    volumes:
      - postgres-orders-data:/var/lib/postgresql/data

  postgres-warehouse:
    image: postgres:16
    container_name: marketplace-warehouse-db
    environment:
      POSTGRES_DB: warehouse_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5445:5432"
    volumes:
      - postgres-warehouse-data:/var/lib/postgresql/data

  postgres-payments:
    image: postgres:16
    container_name: marketplace-payments-db
    environment:
      POSTGRES_DB: payments_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5446:5432"
    volumes:
      - postgres-payments-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: marketplace-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres-identity-data:
  postgres-catalog-data:
  postgres-orders-data:
  postgres-warehouse-data:
  postgres-payments-data: